<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4EFE6">
<title>SYNRG · Можеш ли да пазиш тайна?</title>
<meta property="og:title" content="SYNRG · Можеш ли да пазиш тайна?">
<meta property="og:image" content="../assets/synrg_Primary_Logo.svg">

<style>
  @font-face {
    font-family: 'MontBlanc';
    src: url('../fonts/MontBlanc-Bold.woff2') format('woff2'),
         url('../fonts/MontBlanc-Bold.woff') format('woff');
    font-weight: 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'MontBlanc';
    src: url('../fonts/MontBlanc-BoldItalic.woff2') format('woff2'),
         url('../fonts/MontBlanc-BoldItalic.woff') format('woff');
    font-weight: 700; font-style: italic; font-display: swap;
  }
  @font-face {
    font-family: 'MontBlanc';
    src: url('../fonts/MontBlanc-SemiBold.woff2') format('woff2'),
         url('../fonts/MontBlanc-SemiBold.woff') format('woff');
    font-weight: 600; font-style: normal; font-display: swap;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root{
    --mint: #c4e9bf;
    --mint-ink: #2f6b46;
    --logan: #AAA9CD;
    --logan-ink: #6f6dae;
    --cream: #f7f4ee;
    --page: #F4EFE6;
    --black: #0b0f0c;
    --border: rgba(255,255,255,0.08);
    --border-ink: rgba(13,21,16,0.12);
    --ink: #16231b;
    --ink-muted: #6b7566;
  }

  html { -webkit-font-smoothing: antialiased; }
  body{
    background:
      linear-gradient(rgba(244,239,230,0.55), rgba(244,239,230,0.65)),
      url('../assets/secret-bg.jpg') center/cover no-repeat;
    background-color: var(--page);
    color: var(--ink);
    font-family: 'MontBlanc', system-ui, sans-serif;
    font-weight: 600;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  h1, h2 { font-style: italic; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; }
  p { font-weight: 600; line-height: 1.65; }
  a { color: inherit; }

  .wrap { max-width: 520px; width: 100%; }

  .headline {
    text-align: center; color: var(--ink);
    font-size: 32px; margin-bottom: 24px;
  }

  /* ── Black banner ── */
  .banner {
    background: var(--black);
    border-radius: 26px;
    padding: 56px 32px;
    text-align: center;
    margin-bottom: 28px;
  }
  .banner .soon {
    color: var(--cream); opacity: 0.75;
    font-size: 15px; font-weight: 700; font-style: italic;
    margin-bottom: 26px;
  }
  .banner .mark { height: 130px; width: auto; margin: 0 auto 26px; display: block; }
  .banner h2 { font-size: 34px; color: var(--cream); }
  .banner h2 .u { color: var(--mint); }

  .explain {
    text-align: center; font-size: 14px; color: var(--ink-muted);
    padding: 0 10px; font-weight: 600;
  }
  .explain b { color: var(--mint-ink); font-style: italic; font-weight: 700; }

  footer { text-align: center; margin-top: 28px; }
  footer .fline { font-size: 12px; color: var(--ink-muted); font-weight: 600; }

  .lang {
    position: fixed; top: 20px; right: 20px; z-index: 10;
  }
  .lang a {
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink); text-decoration: none;
    border: 1px solid var(--border-ink); border-radius: 100px;
    padding: 6px 14px; background: rgba(13,21,16,0.03);
  }
  .lang a:hover { color: var(--mint-ink); border-color: var(--mint-ink); }

  @media (max-width: 420px) {
    .headline { font-size: 26px; }
    .banner { padding: 44px 24px; }
    .banner .mark { height: 96px; }
    .banner h2 { font-size: 27px; }
  }
</style>
</head>
<body>

<div class="lang"><a href="en/">EN</a></div>

<div class="wrap">

  <h1 class="headline">Можеш ли да пазиш тайна?</h1>

  <div class="banner">
    <div class="soon">SYNRG ще бъде скоро и тук.</div>
    <img class="mark" src="../assets/synrg_Logomark.svg" alt="SYNRG">
    <h2>Пука ми за <span class="u">вас</span>!</h2>
  </div>

  <p class="explain">Превенция, движение и хранене — под грижата на един екип. Лекар, физиотерапевт и треньори, с <b>Д-р Желязова</b> и <b>Д-р Соколова</b> до нас.</p>

  <footer>
    <div class="fline">SYNRG Beyond Fitness · Варна</div>
  </footer>

</div>

</body>
</html>
