<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Проследи храненето, теглото и стъпките — безплатно. Създай профил в SYNRG Beyond Fitness без ангажимент." />
  <meta name="theme-color" content="#0d1510" />
  <meta name="facebook-domain-verification" content="fcprmnqsdhxyl9prxrpzj99cmrk2fj" />
  <meta property="og:title" content="Започни безплатно — SYNRG Beyond Fitness" />
  <meta property="og:description" content="Хранителен тракер, тегло и стъпки. Безплатно, без ангажимент." />
  <meta property="og:image" content="assets/synrg_Primary_Logo.svg" />
  <title>Започни безплатно — SYNRG Beyond Fitness</title>

  <style>
    @font-face {
      font-family: 'MontBlanc';
      src: url('fonts/MontBlanc-Bold.woff2') format('woff2'),
           url('fonts/MontBlanc-Bold.woff') format('woff');
      font-weight: 700; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'MontBlanc';
      src: url('fonts/MontBlanc-BoldItalic.woff2') format('woff2'),
           url('fonts/MontBlanc-BoldItalic.woff') format('woff');
      font-weight: 700; font-style: italic; font-display: swap;
    }
    @font-face {
      font-family: 'MontBlanc';
      src: url('fonts/MontBlanc-SemiBold.woff2') format('woff2'),
           url('fonts/MontBlanc-SemiBold.woff') format('woff');
      font-weight: 600; font-style: normal; font-display: swap;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --mint:         #c4e9bf;
      --mint-dim:     rgba(196,233,191,0.10);
      --mint-border:  rgba(196,233,191,0.22);
      --logan:        #AAA9CD;
      --logan-dim:    rgba(170,169,205,0.10);
      --logan-border: rgba(170,169,205,0.24);
      --cream:        #f0eded;
      --bg:           #0d1510;
      --surface:      #111c13;
      --card:         #131f14;
      --border:       rgba(255,255,255,0.07);
      --muted:        #5a6e5a;
      --text:         #e8e4e4;
      --nav-h:        80px;
      --ease:         cubic-bezier(0.4, 0, 0.2, 1);
      --ease-spring:  cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body { background: var(--bg); color: var(--cream); font-family: 'MontBlanc', system-ui, sans-serif; font-weight: 600; overflow-x: hidden; line-height: 1.6; }

    h1, h2, h3 { font-style: italic; font-weight: 700; line-height: 1.05; color: var(--cream); letter-spacing: -0.03em; }
    p { font-weight: 600; color: var(--muted); line-height: 1.65; }
    a { text-decoration: none; color: inherit; }

    .container { max-width: 960px; margin: 0 auto; padding: 0 24px; }

    /* ── Nav ── */
    #navbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--nav-h); z-index: 100;
      display: flex; align-items: center; padding: 0 24px;
      background: transparent; transition: background 0.3s var(--ease), border-color 0.3s;
      border-bottom: 1px solid transparent;
    }
    #navbar.scrolled { background: rgba(13,21,16,0.92); backdrop-filter: blur(20px); border-bottom-color: var(--border); }
    .nav-inner { width: 100%; max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo img { height: 72px; width: auto; }
    .nav-login {
      font-size: 13px; font-weight: 700; color: var(--muted); font-style: italic;
      padding: 8px 20px; border-radius: 100px; border: 1px solid var(--border);
      transition: color 0.2s, border-color 0.2s;
    }
    .nav-login:hover { color: var(--cream); border-color: rgba(255,255,255,0.2); }

    /* ── Form section ── */
    #signup {
      min-height: 100svh;
      padding: calc(var(--nav-h) + 48px) 0 64px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .form-card {
      width: 100%; max-width: 440px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 24px; padding: 40px 36px;
    }
    .form-card h2 { font-size: 28px; margin-bottom: 6px; text-align: center; }
    .form-card .form-sub { text-align: center; font-size: 14px; margin-bottom: 28px; }

    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
    .input-group input {
      width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px 16px; color: var(--cream);
      font-family: 'MontBlanc', sans-serif; font-size: 15px; font-weight: 600;
      outline: none; transition: border-color 0.2s;
    }
    .input-group input::placeholder { color: var(--muted); }
    .input-group input:focus { border-color: var(--mint-border); }

    .btn-submit {
      width: 100%; margin-top: 8px;
      background: var(--mint); color: #0d1510;
      border: none; border-radius: 100px; padding: 16px;
      font-family: 'MontBlanc', sans-serif; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: transform 0.2s var(--ease), opacity 0.2s;
    }
    .btn-submit:hover { transform: translateY(-2px); opacity: 0.92; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .form-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 16px; }
    .form-note a { color: var(--logan); text-decoration: underline; }

    .form-error {
      display: none; background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3);
      color: #F87171; font-size: 13px; border-radius: 10px; padding: 10px 14px;
      margin-bottom: 14px; text-align: center;
    }
    .form-error.show { display: block; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .form-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>

  <!-- ── Nav ── -->
  <header id="navbar">
    <div class="nav-inner">
      <a href="./index.html" aria-label="SYNRG Начало">
        <img src="assets/synrg_Primary_Logo.svg" alt="SYNRG Beyond Fitness" style="height:72px;width:auto;" />
      </a>
      <a href="./app/index.html" class="nav-login">Влез →</a>
    </div>
  </header>

  <main>

    <!-- ── Sign up form ── -->
    <section id="signup">
      <div class="container" style="display:flex;flex-direction:column;align-items:center;">
        <div class="form-card">
          <h2>Създай акаунт</h2>
          <p class="form-sub">Безплатно. Без кредитна карта.</p>

          <div class="form-error" id="form-error"></div>

          <form id="reg-form" onsubmit="handleRegister(event)" autocomplete="on">
            <div class="input-group">
              <label for="reg-name">Ime и фамилия</label>
              <input id="reg-name" name="name" type="text" placeholder="Петър Иванов" required autocomplete="name" />
            </div>
            <div class="input-group">
              <label for="reg-email">Имейл</label>
              <input id="reg-email" name="email" type="email" placeholder="peter@example.com" required autocomplete="email" />
            </div>
            <div class="input-group">
              <label for="reg-pass">Парола</label>
              <input id="reg-pass" name="password" type="password" placeholder="Минимум 6 символа" required autocomplete="new-password" minlength="6" />
            </div>
            <button type="submit" class="btn-submit" id="submit-btn">Създай безплатен акаунт →</button>
          </form>

          <p class="form-note">
            Вече имаш акаунт? <a href="./app/index.html">Влез тук</a>
          </p>
        </div>
      </div>
    </section>

  </main>

  <script>
    // ── Nav scroll effect ──
    const navbar = document.getElementById('navbar')
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 40)
    }, { passive: true })

    // ── Supabase config ──
    const SB_URL = 'https://nzrtdqlgljcipfmectwp.supabase.co'
    const SB_KEY = 'sb_publishable_Rs2gzY1pSf67S-uq6VpGGA_fQdSgMah'
    const FREE_MODULES = ['nutrition_tracking', 'weight_tracking', 'steps_tracking']

    async function handleRegister(e) {
      e.preventDefault()
      const name     = document.getElementById('reg-name').value.trim()
      const email    = document.getElementById('reg-email').value.trim().toLowerCase()
      const password = document.getElementById('reg-pass').value
      const btn      = document.getElementById('submit-btn')
      const errEl    = document.getElementById('form-error')

      errEl.classList.remove('show')

      if (password.length < 6) {
        showError('Паролата трябва да е поне 6 символа.')
        return
      }

      btn.disabled = true
      btn.textContent = 'Създаване...'

      try {
        // Registration goes through the auth-register edge function — it
        // hashes the password server-side (clients table only has
        // password_hash, no plaintext password column) and does the
        // name-exists + rate-limit checks. A direct REST insert here used to
        // send a plaintext `password` field that doesn't exist as a column,
        // breaking every signup from this page.
        const res = await fetch(SB_URL + '/functions/v1/auth-register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SB_KEY },
          body: JSON.stringify({ name, password, email }),
        })
        const result = await res.json().catch(() => ({}))

        if (!res.ok || !result.ok) {
          if (res.status === 409) throw new Error('Вече съществува акаунт с това ime. Избери друго.')
          if (res.status === 429) throw new Error('Твърде много опити. Опитай пак след малко.')
          if (res.status === 403) throw new Error('Неуспешна проверка. Опитай отново.')
          if (res.status === 400) throw new Error(/password/i.test(result.error || '') ? 'Паролата трябва да е поне 6 символа.' : 'Невалидно ime.')
          throw new Error(result.error || 'Грешка при създаване на акаунт.')
        }

        const newClient = result.client
        if (!newClient || !newClient.id) {
          throw new Error('Неочаквана грешка. Опитай отново.')
        }

        // Set auth in localStorage (same format as the app)
        localStorage.setItem('synrg_auth', JSON.stringify({
          isLoggedIn: true,
          role:       'client',
          name:       newClient.name,
          id:         newClient.id,
          modules:    FREE_MODULES,
        }))

        // Redirect to app
        window.location.href = './app/index.html'

      } catch (err) {
        showError(err.message || 'Нещо се обърка. Опитай отново.')
        btn.disabled = false
        btn.textContent = 'Създай безплатен акаунт →'
      }
    }

    function showError(msg) {
      const el = document.getElementById('form-error')
      el.textContent = msg
      el.classList.add('show')
    }
  </script>

<script src="cookie-banner.js" defer></script>
<script src="meta-pixel.js" defer></script>
</body>
</html>
